name: Ingest approved guide artwork

on:
  push:
    branches:
      - design/clean-guide-library
    paths:
      - .github/workflows/ingest-approved-guide-artwork.yml

permissions:
  contents: write

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/clean-guide-library
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download and normalize owner-approved artwork
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps, ImageFilter, ImageEnhance
          import io, json

          root = Path('.')
          out = root / 'assets' / 'guides'
          out.mkdir(parents=True, exist_ok=True)

          # These signed URLs are used once, during this workflow only. The website
          # never references them; the resulting WebPs are committed to this repo.
          assets = {
            'ai-for-documents-spreadsheets-meetings': ('https://media.canva.com/v2/image-resize/format:JPG/height:864/quality:95/uri:ifs%3A%2F%2FM%2F98389228-c16f-4d37-9395-a1ae3d0db18f/watermark:F/width:1536?csig=AAAAAAAAAAAAAAAAAAAAANRm5G-25B8A3gOgeAVa5XtIwxiIzffYGfhZnbzAfeyC&exp=1786440426&osig=AAAAAAAAAAAAAAAAAAAAANuGj8j09JfpXxY0rRsfnxFYttUPykxak9c8W2SkoBuQ&signer=media-rpc&x-canva-quality=thumbnail', (1536,864)),
            'evaluate-ai-output-scorecard': ('https://media.canva.com/v2/image-resize/format:JPG/height:864/quality:95/uri:ifs%3A%2F%2FM%2F4492273b-5db8-429f-8e75-8503cec69266/watermark:F/width:1536?csig=AAAAAAAAAAAAAAAAAAAAAHuuQY29bVTWoj-mCcmzdhHJRycAC2pEv6Ed-_ct1sDR&exp=1786440623&osig=AAAAAAAAAAAAAAAAAAAAAKVe4OoI3blvFGsodq-t3dbaIFaRWp7QQFz5Ku7CWwMS&signer=media-rpc&x-canva-quality=thumbnail', (1536,864)),
            'choose-your-first-ai-subscription': ('https://media.canva.com/v2/image-resize/format:JPG/height:864/quality:95/uri:ifs%3A%2F%2FM%2F26c909fd-401a-4326-b78f-3bacf0493fdf/watermark:F/width:1536?csig=AAAAAAAAAAAAAAAAAAAAAIa9rZUdio3HsKykHn7ZdNavCSE8s9Hf-y6K2pPtiakg&exp=1786438597&osig=AAAAAAAAAAAAAAAAAAAAANWVpj5iTNB7_72zmB4Zhtfw0sWfxwVOeZbYpHQXiPmV&signer=media-rpc&x-canva-quality=thumbnail', (1536,864)),
            'multimodal-ai-practical-guide': ('https://media.canva.com/v2/image-resize/format:JPG/height:1024/quality:95/uri:ifs%3A%2F%2FM%2F2022c06c-507e-4cf6-aacf-259df7dbebe9/watermark:F/width:1536?csig=AAAAAAAAAAAAAAAAAAAAAE2qeg4BFeyuqVaA_Zxiql4Gx-fzuFcvaAQ21b1Wqv9m&exp=1786440468&osig=AAAAAAAAAAAAAAAAAAAAAKEeuzwoIyvbk6mgzKhqEfSH12ppu5Wjb9OGZLJqyJY0&signer=media-rpc&x-canva-quality=thumbnail', (1536,1024)),
            'ai-governance-starter-kit': ('https://media.canva.com/v2/image-resize/format:JPG/height:864/quality:95/uri:ifs%3A%2F%2FM%2Fcc9ffe67-2a0c-46bc-a78f-ca7a1ae9115a/watermark:F/width:1536?csig=AAAAAAAAAAAAAAAAAAAAAMPFnfhd2ZkXPblI6nlc8odvnbHN_FZ87Tr3gM0HIIEV&exp=1786438676&osig=AAAAAAAAAAAAAAAAAAAAAG21l6cX81bZahfU8gMuaHFuV_t-WzUVorFcljdJV7n-&signer=media-rpc&x-canva-quality=thumbnail', (1536,864)),
            'connect-ai-to-github': ('https://media.canva.com/v2/image-resize/format:JPG/height:1024/quality:95/uri:ifs%3A%2F%2FM%2F0a8becc4-b4f1-43a6-ba22-e9622b8f5ee0/watermark:F/width:1536?csig=AAAAAAAAAAAAAAAAAAAAAB-ALQ05Pzi-gs49H6sRfX2KioUvT0pNLD4fiS3HltWy&exp=1786440696&osig=AAAAAAAAAAAAAAAAAAAAAD1wzlKIku2BG2LO6RtzajnRjhffmg-Z9mOQNY5ynI-9&signer=media-rpc&x-canva-quality=thumbnail', (1536,1024)),
            'obsidian-ai-second-brain': ('https://media.canva.com/v2/image-resize/format:JPG/height:1024/quality:95/uri:ifs%3A%2F%2FM%2Fb8934465-29cc-4a30-8bb1-3981422d66e5/watermark:F/width:1536?csig=AAAAAAAAAAAAAAAAAAAAAFIo6xSNDvUE2gmbXAaDFhx9EotA5uDTtg1qfUePXBci&exp=1786440768&osig=AAAAAAAAAAAAAAAAAAAAAJtmWuC8VpwtMXcqPdEqfKRtEy3KIW9ZwZkV_HIvUIi-&signer=media-rpc&x-canva-quality=thumbnail', (1536,1024)),
            'understand-hugging-face': ('https://media.canva.com/v2/image-resize/format:JPG/height:768/quality:95/uri:ifs%3A%2F%2FM%2Fcdefbf40-37a2-40a5-a4ca-310380f0f47b/watermark:F/width:1376?csig=AAAAAAAAAAAAAAAAAAAAANTBpkb7VqorQbOKklqhbF1YqFdtcECRgm44AhmKR9iT&exp=1786438232&osig=AAAAAAAAAAAAAAAAAAAAADd3DUO5dhGcMAXps8RlmUmAdOo-mxuG-v8EgqJfdlSK&signer=media-rpc&x-canva-quality=thumbnail', (1376,768)),
            'build-first-rag-knowledge-base': ('https://media.canva.com/v2/image-resize/format:JPG/height:768/quality:95/uri:ifs%3A%2F%2FM%2Fee940891-3b1a-4eca-aac8-e529ee089c94/watermark:F/width:1376?csig=AAAAAAAAAAAAAAAAAAAAAPuDFJPiIDdzFxKeqSpcEcEZR1kOeDhAGhydNJpc8YM-&exp=1786439786&osig=AAAAAAAAAAAAAAAAAAAAAKAZwFjL3sBNqW5MJHZGOavbNkEJoaW0PE4xnine4CHj&signer=media-rpc&x-canva-quality=thumbnail', (1376,768)),
            'create-reusable-ai-skills': ('https://media.canva.com/v2/image-resize/format:JPG/height:768/quality:95/uri:ifs%3A%2F%2FM%2F31a1ad2e-9e27-4188-a2fc-c23ba555ac65/watermark:F/width:1376?csig=AAAAAAAAAAAAAAAAAAAAALHMkd0D5kONHcAiVQosGiLXD3cgo67lzWgf4numgLcX&exp=1786440821&osig=AAAAAAAAAAAAAAAAAAAAAOMzD82IwoGiDuwFAA9K225WR3iifRnFFNqMmbVuBjLl&signer=media-rpc&x-canva-quality=thumbnail', (1376,768)),
          }

          bytes_by_slug = {}
          for slug, (url, expected) in assets.items():
              req = Request(url, headers={
                  'User-Agent': 'Mozilla/5.0',
                  'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
                  'Referer': 'https://www.canva.com/'
              })
              with urlopen(req, timeout=40) as r:
                  data = r.read()
              if len(data) < 20_000:
                  raise RuntimeError(f'{slug}: downloaded file is too small ({len(data)} bytes)')
              im = Image.open(io.BytesIO(data)).convert('RGB')
              if im.width < 900 or im.height < 500:
                  raise RuntimeError(f'{slug}: source resolution too small: {im.size}')
              # Preserve the entire approved image. 16:9 sources fill the frame;
              # 3:2 sources are contained over a subtle blurred extension.
              fg = ImageOps.contain(im, (960, 540), Image.Resampling.LANCZOS)
              if fg.size == (960, 540):
                  canvas = fg
              else:
                  bg = ImageOps.fit(im, (960, 540), Image.Resampling.LANCZOS)
                  bg = bg.filter(ImageFilter.GaussianBlur(22))
                  bg = ImageEnhance.Brightness(bg).enhance(1.04)
                  canvas = bg
                  x = (960 - fg.width) // 2
                  y = (540 - fg.height) // 2
                  canvas.paste(fg, (x, y))
              dest = out / f'{slug}.webp'
              canvas.save(dest, 'WEBP', quality=88, method=6)
              bytes_by_slug[slug] = dest.stat().st_size
              print(slug, im.size, '->', dest, bytes_by_slug[slug])

          manifest_path = out / 'manifest.json'
          manifest = json.loads(manifest_path.read_text())
          for item in manifest['items']:
              if item['slug'] in bytes_by_slug:
                  item['sourceCandidate'] = 'owner-uploaded'
                  item['provenance'] = 'owner-approved uploaded guide artwork'
                  item['width'] = 960
                  item['height'] = 540
                  item['bytes'] = bytes_by_slug[item['slug']]
          manifest['generatedFor'] = 'AI Compass'
          manifest['runtimeGeneration'] = False
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Commit permanent guide artwork
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/guides/*.webp assets/guides/manifest.json
          if git diff --cached --quiet; then
            echo 'No artwork changes to commit'
            exit 0
          fi
          git commit -m 'fix(guides): store owner-approved artwork locally [artwork-ingest]'
          git push origin HEAD:design/clean-guide-library
