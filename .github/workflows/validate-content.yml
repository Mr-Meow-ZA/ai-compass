name: Validate AI Compass Content

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and content relationships
        run: npm run check
      - name: Render visual smoke routes in Chrome
        run: bash scripts/smoke-visuals.sh
      - name: Render enterprise builder routes in Chrome
        run: bash scripts/smoke-enterprise.sh
      - name: Render discovery and navigation routes in Chrome
        run: bash scripts/smoke-discovery.sh
      - name: Render signal and curriculum routes in Chrome
        run: bash scripts/smoke-intelligence.sh
      - name: Render structured content and freshness routes in Chrome
        run: bash scripts/smoke-freshness.sh
      - name: Render live public community routes in Chrome
        run: bash scripts/smoke-community.sh
      - name: Upload visual smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-compass-visual-smoke
          path: |
            visual-smoke-home.png
            visual-smoke-guides.png
            visual-smoke-news.png
            visual-smoke-mobile.png
            visual-smoke-dashboard.png
            visual-smoke-dashboard-mobile.png
            visual-smoke-infographic.png
            visual-smoke-infographic-mobile.png
            visual-smoke-enterprise-architecture.png
            visual-smoke-enterprise-architecture-mobile.png
            visual-smoke-enterprise-path.png
            visual-smoke-enterprise-path-mobile.png
            visual-smoke-tools.png
            visual-smoke-models.png
            visual-smoke-courses.png
            visual-smoke-practical.png
            visual-smoke-resources.png
            visual-smoke-learn.png
            visual-smoke-courses-mobile.png
            visual-smoke-discovery-home-mobile.png
            visual-smoke-intelligence-news.png
            visual-smoke-intelligence-learn.png
            visual-smoke-power-user-path.png
            visual-smoke-intelligence-news-mobile.png
            visual-smoke-intelligence-learn-mobile.png
            visual-smoke-freshness-guides.png
            visual-smoke-freshness-article.png
            visual-smoke-freshness-tools.png
            visual-smoke-freshness-courses.png
            visual-smoke-freshness-news.png
            visual-smoke-freshness-guides-mobile.png
            visual-smoke-freshness-news-mobile.png
            visual-smoke-community.png
            visual-smoke-community-profile.png
            visual-smoke-community-category.png
            visual-smoke-community-mobile.png
            visual-smoke-my-compass.png
            visual-smoke-community-guide.png
            visual-smoke-community-learning.png
            visual-smoke-home.html
            visual-smoke-guides.html
            visual-smoke-news.html
            visual-smoke-article.html
            visual-smoke-mobile.html
