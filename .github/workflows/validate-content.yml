name: Validate AI Compass Content

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and content relationships
        run: npm run check
      - name: Render visual smoke routes in Chrome
        run: bash scripts/smoke-visuals.sh
      - name: Render enterprise builder routes in Chrome
        run: bash scripts/smoke-enterprise.sh
      - name: Render discovery and navigation routes in Chrome
        run: bash scripts/smoke-discovery.sh
      - name: Upload visual smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-compass-visual-smoke
          path: |
            visual-smoke-home.png
            visual-smoke-guides.png
            visual-smoke-news.png
            visual-smoke-mobile.png
            visual-smoke-dashboard.png
            visual-smoke-dashboard-mobile.png
            visual-smoke-infographic.png
            visual-smoke-infographic-mobile.png
            visual-smoke-enterprise-architecture.png
            visual-smoke-enterprise-architecture-mobile.png
            visual-smoke-enterprise-path.png
            visual-smoke-enterprise-path-mobile.png
            visual-smoke-tools.png
            visual-smoke-models.png
            visual-smoke-courses.png
            visual-smoke-practical.png
            visual-smoke-resources.png
            visual-smoke-learn.png
            visual-smoke-courses-mobile.png
            visual-smoke-discovery-home-mobile.png
            visual-smoke-home.html
            visual-smoke-guides.html
            visual-smoke-news.html
            visual-smoke-article.html
            visual-smoke-mobile.html
            visual-smoke-dashboard.html
            visual-smoke-dashboard-mobile.html
            visual-smoke-infographic.html
            visual-smoke-infographic-mobile.html
            visual-smoke-enterprise-architecture.html
            visual-smoke-enterprise-architecture-mobile.html
            visual-smoke-enterprise-path.html
            visual-smoke-enterprise-path-mobile.html
            visual-smoke-tools.html
            visual-smoke-models.html
            visual-smoke-courses.html
            visual-smoke-practical.html
            visual-smoke-resources.html
            visual-smoke-learn.html
            visual-smoke-courses-mobile.html
            visual-smoke-discovery-home-mobile.html
          if-no-files-found: ignore
          retention-days: 7
