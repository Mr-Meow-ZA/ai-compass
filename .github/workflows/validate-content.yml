name: Validate AI Compass Content

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and content relationships
        run: npm run check
      - name: Render visual smoke routes in Chrome
        run: bash scripts/smoke-visuals.sh
      - name: Upload visual smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-compass-visual-smoke
          path: |
            visual-smoke-home.png
            visual-smoke-guides.png
            visual-smoke-news.png
            visual-smoke-mobile.png
            visual-smoke-admin.png
            visual-smoke-home.html
            visual-smoke-guides.html
            visual-smoke-news.html
            visual-smoke-article.html
            visual-smoke-mobile.html
            visual-smoke-admin.html
          if-no-files-found: ignore
          retention-days: 7
