<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b12"><title>AI Guild</title><style>:root{--bg:#090b12;--p:#141925;--ln:#2c3448;--tx:#f5f7ff;--mu:#909bb1;--a:#9d7cff;--b:#5fddff;--g:#5fe0b5;--gold:#edbd68}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 0,#261b49 0,transparent 36%),radial-gradient(circle at 90% 8%,#103442 0,transparent 30%),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{height:100vh;position:sticky;top:0;border-right:1px solid var(--ln);background:#0b0e17e8;padding:18px 12px}.brand{display:flex;gap:10px;align-items:center;padding:8px 8px 20px}.mark{width:36px;height:36px;border:1px solid #7158d8;border-radius:10px;display:grid;place-items:center;background:#21183c;font-size:20px}.tiny{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.14em}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--mu);text-align:left;padding:11px;border-radius:9px}.nav button.on{color:#fff;background:#ffffff0b}.main{padding:22px 26px 80px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.top h1{margin:2px 0;font-size:24px}.top p{margin:0;color:var(--mu);font-size:11px}.btn{border:1px solid var(--ln);background:#1a2030;color:#fff;border-radius:9px;padding:9px 12px}.primary{background:linear-gradient(135deg,#7453e5,#397ed4);border-color:#866cec}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:12px}.card{background:linear-gradient(180deg,#161c29ed,#101520ed);border:1px solid var(--ln);border-radius:14px;box-shadow:0 16px 45px #0006}.stat{padding:15px}.stat span{font-size:9px;color:var(--mu);letter-spacing:.12em;text-transform:uppercase}.stat strong{display:block;font-size:22px;margin-top:7px}.hero{padding:17px;display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.party{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.char{padding:13px;border:1px solid #313a50;border-radius:12px;background:#ffffff05}.portrait{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:23px;font-weight:800;border:1px solid var(--c);background:#ffffff07}.char h3{font-size:12px;margin:10px 0 2px}.role{font-size:9px;color:var(--mu);min-height:24px}.lvl{font-size:9px;color:var(--gold);margin:9px 0 6px}.bar{height:6px;background:#090d14;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:99px}.foot{display:flex;justify-content:space-between;color:var(--mu);font-size:8px;margin-top:6px}.quests{padding:15px}.quests h3,.section h3{font-size:13px;margin:4px 0 10px}.quest{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;border-top:1px solid #252d3d;padding:10px 0}.quest:first-of-type{border-top:0}.ico{width:30px;height:30px;border-radius:9px;background:#ffffff08;display:grid;place-items:center;color:var(--gold)}.quest b{font-size:10px}.quest p{font-size:8px;color:var(--mu);margin:3px 0}.xp{color:var(--g);font-size:9px}.cols{grid-template-columns:1fr 1fr;margin-top:12px}.section{padding:16px}.feed{display:grid;gap:7px}.event{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;padding:9px;border:1px solid #273044;border-radius:9px;background:#ffffff04}.event b{font-size:10px}.event p{font-size:8px;color:var(--mu);margin:3px 0 0}.gear{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.item{padding:12px;border:1px solid #2d3649;border-radius:10px;background:#ffffff04}.item.lock{opacity:.35}.item .big{font-size:21px}.item b{display:block;font-size:10px;margin:7px 0 2px}.item span{font-size:8px;color:var(--mu)}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px;max-width:760px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em}.field input,.field select{background:#0c111b;border:1px solid #313a50;color:#fff;border-radius:9px;padding:11px;width:100%}.preview{padding:12px;border:1px dashed #3b465e;border-radius:9px;color:var(--mu);font-size:10px}.preview strong{color:var(--g);font-size:18px}.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.cyber{--gold:#62f1d0;--a:#ff4fd5;--b:#37eaff;--g:#79ff9d}.cyber,.cyber body{background:radial-gradient(circle at 15% 0,#351332 0,transparent 35%),radial-gradient(circle at 90% 8%,#003a42 0,transparent 30%),#070b0d}.mobile{display:none}@media(max-width:900px){.party{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:1fr 1fr}}@media(max-width:700px){.app{display:block}.side{display:none}.main{padding:14px 13px 88px}.mobile{display:flex;position:fixed;z-index:9;bottom:0;left:0;right:0;justify-content:space-around;background:#0b0e17f3;border-top:1px solid var(--ln);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}.mobile button{border:0;background:transparent;color:var(--mu);font-size:9px;padding:7px}.mobile button.on{color:#fff}.hero,.cols{grid-template-columns:1fr}.party{grid-template-columns:1fr 1fr}.gear{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.top h1{font-size:20px}}</style></head><body><div id="root"><div style="padding:30px">Loading AI Guild…</div></div><script>(function(){'use strict';var K='aiguild-preview-v1',A=[{id:'chatgpt',n:'ChatGPT',f:'Aether Strategist',c:'Neural Oracle',x:'✦',col:'#9b7cff'},{id:'claude',n:'Claude',f:'Verdant Sage',c:'Archive Ghost',x:'C',col:'#e39a68'},{id:'cursor',n:'Cursor',f:'Forgeblade',c:'Code Ronin',x:'⌘',col:'#65d8ff'},{id:'codex',n:'Codex',f:'Runesmith',c:'Build Unit 05',x:'◇',col:'#55dfc6'},{id:'copilot',n:'Copilot',f:'Sky Warden',c:'Ops Sentinel',x:'△',col:'#5aa8ff'}],G=[['◈','Initiate Sigil','Core Chip',1],['⚔','Guildblade','Mono Edge',4],['⬡','Aegis Plate','Reactive Shell',8],['✹','Mindstone','Quantum Core',13],['♛','Crown of Mastery','Ascendant Node',20],['∞','Endless Codex','Infinite Stack',30]];function uid(){return'e'+Date.now().toString(36)+Math.random().toString(36).slice(2)}function seed(){var n=Date.now(),d=864e5;return[{id:uid(),a:'chatgpt',t:'research',time:n-d*5,tok:18500,min:38,note:'Mapped a project strategy.'},{id:uid(),a:'claude',t:'chat',time:n-d*4,tok:12200,min:27,note:'Long-form analysis.'},{id:uid(),a:'cursor',t:'code',time:n-d*3,tok:9600,min:56,note:'Implemented and debugged a feature.'},{id:uid(),a:'codex',t:'artifact',time:n-d*2,tok:14800,min:61,note:'Built a working prototype.'},{id:uid(),a:'copilot',t:'work',time:n-d,tok:5200,min:18,note:'Business workflow support.'},{id:uid(),a:'cursor',t:'deploy',time:n-7200000,tok:6100,min:44,note:'Shipped an app update.'},{id:uid(),a:'chatgpt',t:'research',time:n-3600000,tok:8900,min:31,note:'Research and synthesis.'}]}function fresh(){return{theme:'fantasy',page:'hall',selected:'chatgpt',events:seed()}}var S=fresh();try{var z=localStorage.getItem(K);if(z)S=Object.assign(fresh(),JSON.parse(z))}catch(e){}function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}function xp(e){var m={chat:1,research:1.25,code:1.35,image:1.1,artifact:1.5,deploy:1.8,work:1.1}[e.t]||1;return Math.round((35+Math.min((+e.tok||0)/120,700)+Math.min((+e.min||0)*3.2,420))*m)}function st(id){var es=S.events.filter(function(e){return e.a===id}),x=es.reduce(function(n,e){return n+xp(e)},0),l=Math.max(1,Math.floor(Math.sqrt(x/210))+1),lo=(l-1)*(l-1)*210,hi=l*l*210;return{es:es,x:x,l:l,p:Math.max(2,Math.min(100,(x-lo)/(hi-lo)*100||0)),tok:es.reduce(function(n,e){return n+(+e.tok||0)},0),min:es.reduce(function(n,e){return n+(+e.min||0)},0)}}function tot(){return{x:S.events.reduce(function(n,e){return n+xp(e)},0),tok:S.events.reduce(function(n,e){return n+(+e.tok||0)},0),min:S.events.reduce(function(n,e){return n+(+e.min||0)},0)}}function fn(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4?1:2)+'K':Math.round(n)}function ft(m){return m>=60?Math.floor(m/60)+'h '+Math.round(m%60)+'m':Math.round(m)+'m'}function role(a){return S.theme==='cyber'?a.c:a.f}function nav(){return[['hall','⌂','Guild'],['party','♟','Party'],['log','＋','Log XP'],['ach','♛','Awards']].map(function(x){return'<button data-nav="'+x[0]+'" class="'+(S.page===x[0]?'on':'')+'">'+x[1]+' '+x[2]+'</button>'}).join('')}function card(a){var q=st(a.id);return'<div class="char" data-agent="'+a.id+'" style="--c:'+a.col+'"><div class="portrait">'+a.x+'</div><h3>'+a.n+'</h3><div class="role">'+role(a)+'</div><div class="lvl">LEVEL '+q.l+'</div><div class="bar"><i style="width:'+q.p+'%"></i></div><div class="foot"><span>'+fn(q.x)+' XP</span><span>'+q.es.length+' runs</span></div></div>'}function day(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()}function today(){return S.events.filter(function(e){return e.time>=day()})}function quest(i,n,d,c,m,r){return'<div class="quest"><div class="ico">'+i+'</div><div><b>'+n+'</b><p>'+d+' · '+Math.round(c)+'/'+m+'</p><div class="bar"><i style="width:'+Math.min(100,c/m*100)+'%"></i></div></div><div class="xp">+'+r+'</div></div>'}function event(e){var a=A.find(function(x){return x.id===e.a})||A[0],ic={chat:'✦',research:'⌁',code:'⌘',artifact:'◇',deploy:'↑',work:'□',image:'◉'}[e.t]||'✦';return'<div class="event"><div class="ico">'+ic+'</div><div><b>'+a.n+' · '+e.t+'</b><p>'+String(e.note||'')+' · '+fn(e.tok)+' tokens · '+ft(e.min)+'</p></div><div class="xp">+'+xp(e)+'</div></div>'}function hall(){var t=tot(),td=today();return'<div><div class="grid stats"><div class="card stat"><span>Total Guild XP</span><strong>'+fn(t.x)+'</strong></div><div class="card stat"><span>Tokens</span><strong>'+fn(t.tok)+'</strong></div><div class="card stat"><span>AI Time</span><strong>'+ft(t.min)+'</strong></div><div class="card stat"><span>Activities</span><strong>'+S.events.length+'</strong></div></div><div class="card hero"><div><div class="tiny">Your AI party</div><h2 style="font-size:17px;margin:5px 0 13px">Five tools. One evolving guild.</h2><div class="party">'+A.map(card).join('')+'</div></div><div class="quests"><div class="tiny">Daily quests</div><h3>Today’s objectives</h3>'+quest('✦','Warm Up','Log 3 AI sessions',td.length,3,120)+quest('⌁','Deep Work','45 AI minutes',td.reduce(function(n,e){return n+(+e.min||0)},0),45,180)+quest('↑','Ship','Artifact or deployment',td.filter(function(e){return e.t==='deploy'||e.t==='artifact'}).length,1,240)+'</div></div><div class="grid cols"><div class="card section"><h3>Recent adventures</h3><div class="feed">'+S.events.slice().sort(function(a,b){return b.time-a.time}).slice(0,6).map(event).join('')+'</div></div><div class="card section"><h3>Progression system</h3><p style="color:var(--mu);font-size:10px;line-height:1.65">Useful outcomes earn more than prompt volume. Research, coding, artifacts and deployments receive higher multipliers.</p><div class="gear">'+G.slice(0,4).map(function(g){return'<div class="item"><div class="big">'+g[0]+'</div><b>'+(S.theme==='cyber'?g[2]:g[1])+'</b><span>Unlock level '+g[3]+'</span></div>'}).join('')+'</div></div></div></div>'}function party(){var a=A.find(function(x){return x.id===S.selected})||A[0],q=st(a.id);return'<div><div class="card section"><div class="tiny">Character sheet</div><h2>'+a.n+' · '+role(a)+'</h2><div class="bar"><i style="width:'+q.p+'%"></i></div><div class="grid stats" style="margin-top:12px"><div class="stat"><span>Level</span><strong>'+q.l+'</strong></div><div class="stat"><span>Total XP</span><strong>'+fn(q.x)+'</strong></div><div class="stat"><span>Tokens</span><strong>'+fn(q.tok)+'</strong></div><div class="stat"><span>Time</span><strong>'+ft(q.min)+'</strong></div></div><h3>Equipment</h3><div class="gear">'+G.map(function(g){var on=q.l>=g[3];return'<div class="item '+(on?'':'lock')+'"><div class="big">'+g[0]+'</div><b>'+(S.theme==='cyber'?g[2]:g[1])+'</b><span>'+(on?'Equipped':'Level '+g[3])+'</span></div>'}).join('')+'</div></div><div class="card section" style="margin-top:12px"><h3>Choose character</h3><div class="party">'+A.map(card).join('')+'</div></div></div>'}function log(){return'<div class="card section"><div class="tiny">New adventure</div><h2>Grant XP</h2><form id="form" class="form"><div class="field"><label>AI</label><select name="a">'+A.map(function(a){return'<option value="'+a.id+'">'+a.n+' · '+role(a)+'</option>'}).join('')+'</select></div><div class="field"><label>Activity</label><select name="t"><option value="chat">Conversation</option><option value="research">Research</option><option value="code">Coding</option><option value="artifact">Built artifact</option><option value="deploy">Deployment</option><option value="work">Work assist</option><option value="image">Image creation</option></select></div><div class="field"><label>Tokens</label><input name="tok" type="number" value="5000"></div><div class="field"><label>Minutes</label><input name="min" type="number" value="30"></div><div class="field full"><label>Outcome</label><input name="note" placeholder="What did you accomplish?"></div><div class="field full preview">Estimated reward <strong id="prev">+0 XP</strong></div><div class="field full"><button class="btn primary" type="submit">Log adventure + XP</button></div></form></div>'}function ach(){var t=tot(),used=new Set(S.events.map(function(e){return e.a})).size,ships=S.events.filter(function(e){return e.t==='artifact'||e.t==='deploy'}).length,ac=[['✦','First Spark','Log first activity',S.events.length>0],['◎','Context Diver','Track 100K tokens',t.tok>=100000],['⬡','Full Party','Use four AIs',used>=4],['↑','Shipwright','Ship 5 times',ships>=5],['♜','Veteran','One AI level 10',A.some(function(a){return st(a.id).l>=10})],['♛','Ascendant','20 combined levels',A.reduce(function(n,a){return n+st(a.id).l},0)>=20]];return'<div class="card section"><div class="tiny">Collection</div><h2>Achievements</h2><div class="ach">'+ac.map(function(x){return'<div class="item '+(x[3]?'':'lock')+'"><div class="big">'+x[0]+'</div><b>'+x[1]+'</b><span>'+x[2]+'</span></div>'}).join('')+'</div></div>'}function body(){return S.page==='hall'?hall():S.page==='party'?party():S.page==='log'?log():ach()}function render(){document.documentElement.className=S.theme==='cyber'?'cyber':'';document.getElementById('root').innerHTML='<div class="app"><aside class="side"><div class="brand"><div class="mark">✦</div><div><b>AI GUILD</b><div class="tiny">Personal party</div></div></div><nav class="nav">'+nav()+'</nav><button id="theme" class="btn" style="position:absolute;left:18px;right:18px;bottom:20px;width:calc(100% - 36px)">'+(S.theme==='fantasy'?'⚔ Fantasy':'◈ Cyberpunk')+'</button></aside><main class="main"><div class="top"><div><div class="tiny">'+(S.theme==='fantasy'?'Guild campaign':'Neural network')+'</div><h1>'+({hall:'Guild Hall',party:'Party',log:'Log Adventure',ach:'Achievements'}[S.page])+'</h1><p>Your AI ecosystem, turned into a progression game.</p></div><button class="btn primary" data-nav="log">＋ Log XP</button></div>'+body()+'</main></div><div class="mobile">'+nav()+'</div>';bind()}function bind(){document.querySelectorAll('[data-nav]').forEach(function(b){b.onclick=function(){S.page=b.getAttribute('data-nav');save();render();scrollTo(0,0)}});document.querySelectorAll('[data-agent]').forEach(function(b){b.onclick=function(){S.selected=b.getAttribute('data-agent');S.page='party';save();render();scrollTo(0,0)}});var th=document.getElementById('theme');if(th)th.onclick=function(){S.theme=S.theme==='fantasy'?'cyber':'fantasy';save();render()};var f=document.getElementById('form');if(f){var p=function(){var d=new FormData(f);document.getElementById('prev').textContent='+'+xp({t:d.get('t'),tok:+d.get('tok')||0,min:+d.get('min')||0})+' XP'};f.oninput=p;p();f.onsubmit=function(ev){ev.preventDefault();var d=new FormData(f);S.events.push({id:uid(),a:d.get('a'),t:d.get('t'),time:Date.now(),tok:+d.get('tok')||0,min:+d.get('min')||0,note:d.get('note')||''});S.page='hall';save();render()}}}try{render()}catch(e){console.error(e);document.getElementById('root').innerHTML='<main style="padding:32px;color:white"><h1>AI Guild</h1><p>Startup failed. Reload once; your data is safe.</p></main>'}})();</script></body></html>
